[package]
name = "gofund-desktop"
version = "0.1.0"
description = "GoFundBot Tauri 2 desktop shell (CORS-free WebView loading a running frontend service)"
authors = ["GoFundBot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gofund_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true