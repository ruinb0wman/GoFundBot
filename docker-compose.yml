services:
  data-service:
    build:
      context: Service
      dockerfile: Dockerfile
    container_name: gofund-data-service
    ports:
      - "3100:3100"
    env_file:
      - Service/.env
    restart: unless-stopped
    networks:
      - gofund-network

  backend:
    build:
      context: Scripts
      dockerfile: Dockerfile
    container_name: gofundbot
    ports:
      - "5000:5000"
    volumes:
      - ./Scripts/Data:/app/Data
    env_file:
      - Scripts/.env
    environment:
      DATA_SERVICE_BASE_URL: http://data-service:3100/api
    depends_on:
      - data-service
    restart: unless-stopped
    networks:
      - gofund-network

  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile
      target: runner
    container_name: gofund-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gofund-network

volumes:
  db_data:

networks:
  gofund-network:
    driver: bridge
